<!doctype html>
<html lang="{{lang}}">{{! The page shell. See README.md in this folder for every placeholder. }}
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{fullTitle}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{url}}">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3eee3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141a25" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="{{ogType}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{url}}">
<meta property="og:site_name" content="{{siteTitle}}">
<link rel="icon" href="{{basePath}}/favicon.svg" type="image/svg+xml">
<link rel="alternate" type="application/atom+xml" title="{{siteTitle}}" href="{{feedUrl}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400..800;1,400..800&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<link rel="stylesheet" href="{{styleUrl}}">
{{{head}}}
<script src="{{basePath}}/relative-time.js" defer></script>
</head>
<body class="section-{{section}}" data-state="{{state}}">
<a class="skip-link" href="#main">Skip to the writing</a>
{{> header}}
<main id="main">
{{{content}}}
</main>
{{> footer}}
</body>
</html>
